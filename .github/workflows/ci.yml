name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: lookuvi_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d lookuvi_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: file:./test.db
      SHADOW_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/lookuvi_shadow
      AUTH_SECRET: ci-secret-not-for-production
      AI_PROVIDER: mock
      BILLING_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lookuvi:ci .
