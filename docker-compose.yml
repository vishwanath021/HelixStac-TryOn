services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-helix}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helix} -d ${POSTGRES_DB:-helix}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-helix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-helix}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost}
      TRUST_PROXY: "true"
      OBJECT_STORAGE: ${OBJECT_STORAGE:-local}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
      AI_SPEND_CAP_INR: ${AI_SPEND_CAP_INR:?set AI_SPEND_CAP_INR}
      AI_SALON_SPEND_CAP_INR: ${AI_SALON_SPEND_CAP_INR:?set AI_SALON_SPEND_CAP_INR}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      ALLOW_DEV_MAGIC_LINK: "false"
      ALLOW_DEV_OTP: "false"
      SEED_DEMO: "false"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
